  .lt-bai { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
  .lt-bai a { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 16px 6px 8px; border-radius: 999px; background: var(--ttv-the); border: 2px solid var(--goc, var(--ttv-vien)); color: var(--ttv-chu); font-weight: 800; text-decoration: none; }
  .lt-bai img { width: 36px; height: auto; }
  .lt-bai small { font-weight: 700; color: var(--ttv-chu-phu); }
  .lt-xay { margin: 0; padding: 10px 14px; border-radius: 14px; background: var(--ttv-nen); border: 2px dashed var(--ttv-vien); color: var(--ttv-chu-phu); font-weight: 700; }
  @media (max-width: 700px) { .lt-ky-nang { grid-template-columns: 1fr; } .lt-bac { padding: 16px; } }
</style>
<script>window.CONG_CHU = {
  "vi": {
    "tieuDe": "Lộ trình theo khung năng lực",
    "phuDe": "Học tiếng Việt từ 15 tuổi, theo bậc và 4 kỹ năng",
    "gt1": "Lộ trình dành cho người học từ 15 tuổi, kể cả người nước ngoài bắt đầu từ số 0. Xương sống là sách Vui học tiếng Việt Quyển 1–2 (Nhà xuất bản Đại học Sư phạm TP. Hồ Chí Minh) và Về Nhà Em. Mỗi bậc ghi rõ sau khi học, bạn làm được gì ở 4 kỹ năng Nghe, Nói, Đọc, Viết.",

    "nguon": "Lộ trình tham chiếu Khung năng lực tiếng Việt dùng cho người nước ngoài (6 bậc), ban hành kèm theo Thông tư số 17/2015/TT-BGDĐT ngày 01/9/2015 của Bộ trưởng Bộ Giáo dục và Đào tạo. Đây là lộ trình học, không phải chứng chỉ.",
    "lamDuoc": "Học xong bậc này, bạn làm được…",
    "baiHoc": "Học ở đâu",
    "dangXay": "Đang xây dựng: luyện nghe hội thoại, viết văn xuôi, chính tả và ngữ pháp nâng cao theo sườn sách Vui học tiếng Việt.",
    "chuanBi": "Chuẩn bị: luyện 6 thanh và bảng âm",
    "soBai": "{n} bài",
    "xemTienDo": "Xem tiến độ của bạn trong Góc học tập",

  },
  "en": {
    "tieuDe": "Proficiency-based learning path",
    "phuDe": "Learn Vietnamese from age 15, by level and the 4 skills",
    "gt1": "This path is for learners aged 15 and over, including foreigners starting from zero. It is built on the Vui học tiếng Việt books 1–2 (Ho Chi Minh City University of Education Publishing House) and Về Nhà Em. Each level shows what you can do in Listening, Speaking, Reading and Writing.",
    "gt2": "Levels 0 to 2 are available now. We are adding listening to conversations, prose writing, spelling and advanced grammar, following books 1–2.",
    "nguon": "This path refers to the Vietnamese Language Proficiency Framework for foreigners (6 levels), issued with Circular No. 17/2015/TT-BGDĐT of 1 September 2015 by Vietnam's Minister of Education and Training. It is a learning path, not a certificate.",
    "lamDuoc": "After this level, you can…",
    "baiHoc": "Where to learn",
    "dangXay": "In progress: listening to conversations, prose writing, spelling and advanced grammar, following the Vui học tiếng Việt books.",
    "chuanBi": "Get ready: the 6 tones and the sound chart",
    "soBai": "{n} lessons",
    "xemTienDo": "See your progress in My learning corner",
    "bac": "Level {so}"
  }
};</script>

</head>
<body class="cong" data-ttv-khong-thanh data-trang="lo-trinh" data-tieu-de="tieuDe">
  <header class="cong-dau" data-cong-dau></header>
  <main>
    <section class="trang-dau co-canh" data-canh="ho-guom" aria-labelledby="tieu-de-trang">
      <div class="cong-ruot">
        <h1 id="tieu-de-trang" data-chu="tieuDe">Lộ trình theo khung năng lực</h1>

      <div class="cong-ruot">

          <p data-chu="gt1"></p>

          <p class="lt-nguon" data-chu="nguon"></p>
        </div>
        <ol class="lt-bac-ds" id="ds-bac"></ol>
        <p style="margin-top:22px"><a class="ttv-nut-phu" href="/goc-hoc-tap/" data-chu="xemTienDo">Xem tiến độ của bạn trong Góc học tập</a></p>
      </div>
    </section>

  <footer class="cong-chan" data-cong-chan>
    <div data-ttv-chan></div>
  </footer>
<script>
/* Lộ trình theo khung năng lực (15+). Bậc và câu "Mình làm được…" đọc từ TTV_LO_TRINH (mau.cvcec.org/v1/ttv-lo-trinh.js).
   Chỉ liệt kê bài của các góc có nhom: "lo-trinh" trong TTV_DANH_SACH (Vui học, Về Nhà Em).
   Bậc 0 gợi ý phần luyện thanh, bảng âm của góc Luyện nói. Bậc chưa có bài ghi "đang xây dựng". */
(function () {
  "use strict";
  // Tên dễ đọc cho từng luật nhãn bài (khớp "ma" trong ttv-lo-trinh.js); không có thì ghi số bài
  var TEN_LUAT = {
    "vuihoc|q1-b(0[1-9]|1[0-9]|20)": ["Quyển 1 · Bài 1–20", "Book 1 · Lessons 1–20"],
    "vuihoc|q2-b0[1-5]": ["Quyển 2 · Bài 1–5", "Book 2 · Lessons 1–5"],
    "vuihoc|q2-b(0[6-9]|1[0-9]|20)": ["Quyển 2 · Bài 6–20", "Book 2 · Lessons 6–20"],
    "venhaem|[a-z-]+": ["8 món ăn", "8 dishes"]
  };
  var tao = function (t, l, c) { var e = document.createElement(t); if (l) e.className = l; if (c != null) e.textContent = c; return e; };
  function ve() {
    var L = window.TTV_LO_TRINH, C = window.CONG && window.CONG.chu(), T = window.TTV;
    if (!L || !C) return;
    var en = window.CONG.ngonNgu() === "en", ul = document.getElementById("ds-bac");
    ul.textContent = "";
    var goc15 = (window.CONG.danhSach() || []).filter(function (m) { return m.nhom === "lo-trinh"; });
    L.bac.forEach(function (b) {
      var li = tao("li", "lt-bac");
      var dau = tao("div", "lt-bac-dau");
      dau.appendChild(tao("span", "ma", C.bac.replace("{so}", b.bac)));
      dau.appendChild(tao("h2", "", en ? b.ten_en : b.ten_vi));
      dau.appendChild(tao("span", "chang", en ? b.chang_en : b.chang_vi));
      li.appendChild(dau);
      li.appendChild(tao("p", "lt-mo-ta", en ? b.mo_ta_en : b.mo_ta_vi));
      // Bài của các góc Lộ trình ở bậc này
      var bai = [];
      goc15.forEach(function (g) {
        (L.nhanBai[g.id] || []).forEach(function (luat) {
          if (luat.bac !== b.bac) return;
          var ten = TEN_LUAT[g.id + "|" + luat.ma];
          bai.push({ goc: g, chu: ten ? ten[en ? 1 : 0] : C.soBai.replace("{n}", luat.so_bai || "") });
        });
      });
      if (b.bac === 0) {
        var ln = T && T.goc ? T.goc("luyennoi") : null;
        if (ln) bai.push({ goc: ln, chu: C.chuanBi });
      }
      if (!bai.length) { li.className += " dang-xay"; li.appendChild(tao("p", "lt-xay", C.dangXay)); ul.appendChild(li); return; }
      li.appendChild(tao("p", "lt-bai-h", C.lamDuoc));
      var kn = tao("div", "lt-ky-nang");
      L.kyNang.forEach(function (k) {
        var ds = (b.lam_duoc || {})[k.id] || [];
        if (!ds.length) return;
        var o = tao("div"); o.appendChild(tao("h3", "", en ? k.en : k.vi));
        var u = tao("ul"); ds.forEach(function (c) { u.appendChild(tao("li", "", en ? c[1] : c[0])); });
        o.appendChild(u); kn.appendChild(o);
      });
      li.appendChild(kn);
      li.appendChild(tao("p", "lt-bai-h", C.baiHoc));
      var lb = tao("ul", "lt-bai");
      bai.forEach(function (x) {
        var a = tao("a"); a.href = "/#" + x.goc.id; a.style.setProperty("--goc", x.goc.mau);
        if (T && T.anh) { var img = tao("img"); img.src = T.anh(x.goc.trau); img.alt = ""; a.appendChild(img); }
        var s = tao("span"); s.appendChild(document.createTextNode(en ? x.goc.ten_en : x.goc.ten_vi));
        s.appendChild(document.createElement("br")); s.appendChild(tao("small", "", x.chu));
        a.appendChild(s);
        var li2 = tao("li"); li2.appendChild(a); lb.appendChild(li2);
      });
      li.appendChild(lb);
      ul.appendChild(li);
    });
  }
  document.addEventListener("DOMContentLoaded", function () { if (window.CONG) window.CONG.khiDoiChu(ve); ve(); });
  window.addEventListener("load", ve);
})();
</script>
