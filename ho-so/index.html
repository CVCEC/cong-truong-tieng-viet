<body class="cong" data-ttv-khong-thanh data-trang="ho-so" data-tieu-de="tieuDe">
  <header class="cong-dau" data-cong-dau></header>
  <main>
    <section class="trang-dau co-canh" data-canh="hoi-an" aria-labelledby="tieu-de-trang">
      <div class="cong-ruot">
        <h1 id="tieu-de-trang" data-chu="tieuDe">Hồ sơ</h1>

      <div class="cong-ruot">
        <p class="bm-tin" id="tin" role="status" aria-live="polite" hidden></p>
        <div class="bm-the" id="khung-tai"><p data-chu="dangTai">Đang tải…</p></div>
        <div id="noi-dung" hidden>
          <!-- Tài khoản -->
          <form class="bm-the" id="form-tk" novalidate>
            <h2 data-chu="tkTieuDe">Tài khoản</h2>
            <div class="bm-o"><label for="email" data-chu="email">Email</label><input type="email" id="email" readonly></div>
            <div class="bm-o"><label for="ho-ten"><span data-chu="hoTen">Họ và tên</span> *</label><input type="text" id="ho-ten" maxlength="100" autocomplete="name" required></div>
            <div class="bm-o"><label for="nuoc"><span data-chu="nuoc">Nước đang sinh sống</span> *</label><select id="nuoc"></select></div>
            <fieldset class="bm-o"><legend><span data-chu="vaiTro">Bạn là</span> *</legend><div class="bm-chon" id="chon-vai-tro"></div></fieldset>
            <fieldset class="bm-o"><legend><span data-chu="nhomTuoiTk">Nhóm tuổi người giữ tài khoản</span> *</legend>
              <div class="bm-chon">
                <label><input type="radio" name="nhomTuoiTk" value="13-17"><span>13–17</span></label>
                <label><input type="radio" name="nhomTuoiTk" value="18+"><span>18+</span></label>
              </div>
            </fieldset>
            <p class="bm-goi-y" id="dong-y-luc"></p>
            <div class="bm-nut-nhom"><button type="submit" class="ttv-nut" id="nut-luu-tk" data-chu="luuTk">Lưu thông tin tài khoản</button></div>
          </form>

          <!-- Hồ sơ học viên -->
          <form class="bm-the" id="form-hs" novalidate>
            <h2 data-chu="hsTieuDe">Hồ sơ học viên</h2>
            <div class="bm-o"><label for="ten-goi"><span data-chu="tenGoi">Tên gọi</span> *</label><input type="text" id="ten-goi" maxlength="40" required><p class="bm-goi-y" data-chu="tenGoiGoiY"></p></div>
            <div class="bm-o"><label for="biet-danh"><span data-chu="bietDanh">Biệt danh</span> *</label><input type="text" id="biet-danh" maxlength="20" required aria-describedby="loi-bd goi-y-bd"><p class="bm-loi-o" id="loi-bd" hidden></p><p class="bm-goi-y" id="goi-y-bd" data-chu="bietDanhGoiY"></p></div>
            <fieldset class="bm-o"><legend><span data-chu="conVat">Con vật đại diện</span> *</legend><div class="bm-chon bm-con-vat" id="chon-con-vat"></div></fieldset>
            <fieldset class="bm-o"><legend><span data-chu="nhomTuoi">Nhóm tuổi của người học</span> *</legend><div class="bm-chon" id="chon-nhom-tuoi"></div><p class="bm-loi-o" id="loi-nguoi-lon" data-chu="chiNguoiLon" hidden></p></fieldset>
            <fieldset class="bm-o"><legend><span data-chu="doiTuong">Người học là</span> *</legend><div class="bm-chon" id="chon-doi-tuong"></div></fieldset>
            <div class="bm-o"><label for="nuoc-hs"><span data-chu="nuocHoc">Nước tham dự</span> *</label><select id="nuoc-hs"></select></div>
            <label class="bm-dong-y" id="o-giam-ho" hidden><input type="checkbox" id="dy-giam-ho"><span data-chu="dongYGiamHo"></span></label>
            <div class="bm-nut-nhom"><button type="submit" class="ttv-nut" id="nut-luu-hs" data-chu="luuHs">Lưu hồ sơ học viên</button></div>
          </form>

          <div class="bm-the">
            <h2 data-chu="bxhTieuDe">Bảng xếp hạng</h2>
            <label class="bm-cong-tac"><input type="checkbox" role="switch" id="cho-xep-hang"><span><strong data-chu="choXepHang"></strong><br><span class="bm-goi-y" data-chu="bxhGoiY"></span></span></label>
          </div>

            <h2 data-chu="dlTieuDe">Dữ liệu của tôi</h2>
            <p data-chu="dlMoTa"></p>
            <button type="button" class="ttv-nut-phu" id="nut-tai" data-chu="taiDuLieu">Tải dữ liệu của tôi</button>
          </div>

          <!-- Xoá hồ sơ -->

            <h2 data-chu="xoaHsTieuDe">Xoá hồ sơ học viên</h2>

            <label class="bm-dong-y"><input type="checkbox" id="hieu-xoa-hs"><span data-chu="xoaHsHieu"></span></label>
            <button type="button" class="ttv-nut nguy" id="nut-xoa-hs" data-chu="xoaHs">Xoá hồ sơ học viên</button>
          </div>

          <div class="bm-the">
            <h2 data-chu="xoaTkTieuDe">Xoá tài khoản</h2>

            <label class="bm-dong-y"><input type="checkbox" id="hieu-xoa-tk"><span data-chu="xoaTkHieu"></span></label>
            <div class="bm-o" id="o-mk-xoa" hidden><label for="mk-xoa" data-chu="matKhauXacNhan">Nhập mật khẩu để xác nhận</label><input type="password" id="mk-xoa" autocomplete="current-password"></div>
            <button type="button" class="ttv-nut nguy" id="nut-xoa-tk" data-chu="xoaTk">Xoá tài khoản</button>
          </div>
        </div>
      </div>

    <div data-ttv-chan></div>

<script type="module">
import { auth, db } from "/js/firebase-cvcec.js";
import { onAuthStateChanged, GoogleAuthProvider, reauthenticateWithPopup, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import {
  CON_VAT, NHOM_TUOI, DUOI_13, DOI_TUONG, VAI_TRO, nhan, dsNuoc, kiemTraBietDanh, docTaiKhoan, docHoSo, taiKhoanDu,
  luuHoSo, layDuLieu, taiTep, xoaHoSo, xoaTaiKhoan, luuTam
} from "/js/tai-khoan.js?v=6";

const $ = (id) => document.getElementById(id);
const c = () => window.CONG.chu();
const dien = (m, t) => String(m).replace(/\{(\w+)\}/g, (_, k) => (t && t[k] != null ? t[k] : ""));
let nguoiDung = null, taiKhoan = null, hoSo = null, dangChay = false;

function bao(noiDung, loai = "sai") {
  const t = $("tin");
  if (!noiDung) { t.hidden = true; return; }
  t.className = "bm-tin " + loai; t.textContent = noiDung; t.hidden = false; t.scrollIntoView({ block: "nearest" });
}
function baoLoi(e) { const ma = (e && e.code) || "macDinh"; const L = c().loi; bao(L[ma] ? L[ma] : dien(L.macDinh, { ma })); }
async function ban(nut, fn) {
  if (dangChay) return;
  dangChay = true; const cu = nut.innerHTML; nut.disabled = true; nut.textContent = c().dangXuLy;
  try { await fn(); } catch (e) { console.error(e); baoLoi(e); }
  finally { dangChay = false; nut.disabled = false; nut.innerHTML = cu; window.CONG.capNhat(); }
}
const radio = (ten) => { const r = document.querySelector('input[name="' + ten + '"]:checked'); return r ? r.value : null; };
const chonRadio = (ten, gt) => { const r = document.querySelector('input[name="' + ten + '"][value="' + gt + '"]'); if (r) r.checked = true; };
function dungRadio(id, ten, ds, laConVat) {
  const o = $(id), giu = radio(ten); o.textContent = "";
  ds.forEach((m) => {
    const l = document.createElement("label"), i = document.createElement("input"), s = document.createElement("span");
    i.type = "radio"; i.name = ten; i.value = m.id; l.append(i);
    if (laConVat) { const e = document.createElement("span"); e.className = "tk-con-vat"; e.setAttribute("aria-hidden", "true"); e.textContent = m.e; l.append(e); }
    s.textContent = nhan(m); l.append(s); o.append(l);
  });
  if (giu) chonRadio(ten, giu);
}
function dungNuoc(id, chon) {
  const s = $(id), cu = s.value || chon; s.textContent = "";
  dsNuoc().forEach((n) => { const o = document.createElement("option"); o.value = n.ma; o.textContent = n.ten; s.append(o); });
  s.value = cu || "CA";
}
function veDanhMuc() {
  dungNuoc("nuoc", taiKhoan && taiKhoan.nuoc); dungNuoc("nuoc-hs", hoSo && hoSo.nuoc);
  dungRadio("chon-vai-tro", "vaiTro", VAI_TRO);
  dungRadio("chon-con-vat", "conVat", CON_VAT, true);
  dungRadio("chon-nhom-tuoi", "nhomTuoi", NHOM_TUOI);
  dungRadio("chon-doi-tuong", "doiTuong", DOI_TUONG);
  capNhatGiamHo(); veDongY();
}
function veDongY() {
  if (!taiKhoan || !taiKhoan.dongYLuc) return;
  const luc = taiKhoan.dongYLuc.toDate().toLocaleString(window.CONG.ngonNgu() === "en" ? "en-CA" : "vi-VN");
  $("dong-y-luc").textContent = dien(c().dongYLuc, { ban: taiKhoan.phienBanDieuKhoan, luc });
}
function capNhatGiamHo() {
  const duoi = DUOI_13.includes(radio("nhomTuoi"));
  $("o-giam-ho").hidden = !duoi;
  $("loi-nguoi-lon").hidden = !(duoi && taiKhoan && taiKhoan.nhomTuoi !== "18+");
  document.querySelectorAll('input[name="nhomTuoi"]').forEach((i) => { i.closest("label").hidden = taiKhoan && taiKhoan.nhomTuoi !== "18+" && DUOI_13.includes(i.value) && !(hoSo && hoSo.nhomTuoi === i.value); });
}
function dienForm() {
  $("email").value = nguoiDung.email || "";
  $("ho-ten").value = taiKhoan.hoTen; $("nuoc").value = taiKhoan.nuoc;
  chonRadio("vaiTro", taiKhoan.vaiTro); chonRadio("nhomTuoiTk", taiKhoan.nhomTuoi);
  $("ten-goi").value = hoSo.tenGoi; $("biet-danh").value = hoSo.bietDanh; $("nuoc-hs").value = hoSo.nuoc;
  chonRadio("conVat", hoSo.conVat); chonRadio("nhomTuoi", hoSo.nhomTuoi); chonRadio("doiTuong", hoSo.doiTuong);
  $("dy-giam-ho").checked = !!hoSo.dongYGiamHoLuc;
  $("cho-xep-hang").checked = !!hoSo.choXepHang;
  capNhatGiamHo(); veDongY();
}
$("chon-nhom-tuoi").addEventListener("change", capNhatGiamHo);
$("biet-danh").addEventListener("input", () => { const loi = kiemTraBietDanh($("biet-danh").value); $("loi-bd").hidden = !loi; $("loi-bd").textContent = loi ? c()[loi] : ""; });

function duLieuHoSo() {
  return { tenGoi: $("ten-goi").value.trim(), bietDanh: $("biet-danh").value.normalize("NFC").trim(), conVat: radio("conVat"),
    nhomTuoi: radio("nhomTuoi"), doiTuong: radio("doiTuong"), nuoc: $("nuoc-hs").value, choXepHang: $("cho-xep-hang").checked };
}
async function luuHs(d) {
  if (!d.tenGoi || !d.conVat || !d.nhomTuoi || !d.doiTuong || !d.nuoc) { bao(c().canDien); return false; }
  const loi = kiemTraBietDanh(d.bietDanh); if (loi) { bao(c()[loi]); return false; }
  if (DUOI_13.includes(d.nhomTuoi)) {
    if (taiKhoan.nhomTuoi !== "18+") { bao(c().chiNguoiLon); return false; }
    if (!$("dy-giam-ho").checked) { bao(c().canGiamHo); return false; }
  }
  hoSo = await luuHoSo(nguoiDung.uid, d, hoSo);
  hoSo = await docHoSo(nguoiDung.uid);
  luuTam(nguoiDung.uid, hoSo);
  return true;
}
$("form-tk").addEventListener("submit", (e) => { e.preventDefault(); ban($("nut-luu-tk"), async () => {
  const hoTen = $("ho-ten").value.trim(), vaiTro = radio("vaiTro"), nhomTuoi = radio("nhomTuoiTk");
  if (!hoTen || !vaiTro || !nhomTuoi) { bao(c().canDien); return; }
  if (nhomTuoi !== "18+" && DUOI_13.includes(hoSo.nhomTuoi)) { bao(c().chiNguoiLon); return; }
  await setDoc(doc(db, "users", nguoiDung.uid), { ...taiKhoan, hoTen, nuoc: $("nuoc").value, vaiTro, nhomTuoi });
  taiKhoan = await docTaiKhoan(nguoiDung.uid); bao(c().daLuu, "dung");
}); });
$("form-hs").addEventListener("submit", (e) => { e.preventDefault(); ban($("nut-luu-hs"), async () => { if (await luuHs(duLieuHoSo())) bao(c().daLuu, "dung"); }); });
$("cho-xep-hang").addEventListener("change", () => ban($("cho-xep-hang"), async () => {
  const bat = $("cho-xep-hang").checked;
  const ok = await luuHs({ ...duLieuHoSo(), choXepHang: bat });
  if (ok) bao(bat ? c().bxhBat : c().bxhTat, "dung"); else $("cho-xep-hang").checked = !bat;
}));
$("nut-tai").addEventListener("click", () => ban($("nut-tai"), async () => {
  taiTep("du-lieu-truong-tieng-viet-" + new Date().toISOString().slice(0, 10) + ".json", await layDuLieu(nguoiDung.uid));
}));
$("nut-xoa-hs").addEventListener("click", () => ban($("nut-xoa-hs"), async () => {
  if (!$("hieu-xoa-hs").checked) { bao(c().canHieu); return; }
  await xoaHoSo(nguoiDung.uid);
  location.href = "/dang-nhap/?da-xoa-ho-so=1";
}));
const dungMatKhau = () => nguoiDung && nguoiDung.providerData.some((p) => p.providerId === "password");
$("hieu-xoa-tk").addEventListener("change", () => { $("o-mk-xoa").hidden = !($("hieu-xoa-tk").checked && dungMatKhau()); });
$("nut-xoa-tk").addEventListener("click", () => ban($("nut-xoa-tk"), async () => {
  if (!$("hieu-xoa-tk").checked) { bao(c().canHieu); return; }
  // Đăng nhập lại trước khi xoá (Firebase yêu cầu với thao tác nhạy cảm)
  if (dungMatKhau()) {
    const mk = $("mk-xoa").value; if (!mk) { bao(c().canMatKhau); $("mk-xoa").focus(); return; }
    await reauthenticateWithCredential(nguoiDung, EmailAuthProvider.credential(nguoiDung.email, mk));
  } else {
    await reauthenticateWithPopup(nguoiDung, new GoogleAuthProvider());
  }
  await xoaTaiKhoan(nguoiDung);
  location.href = "/?da-xoa-tai-khoan=1";
}));

document.addEventListener("DOMContentLoaded", () => {
  window.CONG.khiDoiChu(() => { if (taiKhoan) { veDanhMuc(); dienForm(); } });
  onAuthStateChanged(auth, async (u) => {
    if (!u) { location.replace("/dang-nhap/?ve=" + encodeURIComponent("/ho-so/")); return; }
    nguoiDung = u;
    try { [taiKhoan, hoSo] = await Promise.all([docTaiKhoan(u.uid), docHoSo(u.uid)]); } catch (e) { baoLoi(e); return; }
    if (!taiKhoanDu(taiKhoan) || !hoSo) { location.replace("/dang-nhap/"); return; }
    $("khung-tai").hidden = true; $("noi-dung").hidden = false;
    veDanhMuc(); dienForm(); window.CONG.capNhat();
  });
});
</script>
</body>
</html>
