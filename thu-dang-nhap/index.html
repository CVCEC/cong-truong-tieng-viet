<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Thử đăng nhập · Trường Tiếng Việt Của Em</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/trang-tri/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/trang-tri/favicon-16.png">
<link rel="apple-touch-icon" href="../assets/trang-tri/apple-touch-icon.png">
<link rel="stylesheet" href="https://mau.cvcec.org/v1/cvcec-chung.css">

<style>
  /* Trang thử đăng nhập (không có trên menu, không cho máy tìm kiếm). Màu và phông chỉ lấy từ biến --ttv-*. */
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--ttv-the); color: var(--ttv-chu); font-family: var(--ttv-phong); line-height: 1.5; }
  [hidden] { display: none !important; }
  .cong-ruot { max-width: 1120px; margin: 0 auto; padding: 0 24px; box-sizing: border-box; }

  /* ---------- Thanh trên ---------- */
  .cong-dau { position: sticky; top: 0; z-index: 40; background: var(--ttv-the); border-bottom: 2px solid var(--ttv-vien); }
  .cong-dau .cong-ruot { display: flex; align-items: center; gap: 16px; height: 72px; }
  .cong-logo { display: inline-flex; align-items: center; min-height: var(--ttv-cham-toi-thieu); border-radius: 12px; }
  .cong-logo img { display: block; width: auto; height: 48px; }
  .cong-dau .ttv-thanh-ngon-ngu { margin-left: auto; }
  .ttv-thanh-ngon-ngu button { min-height: var(--ttv-cham-toi-thieu); }

  /* ---------- Cảnh làng quê ---------- */
  .dn-canh { padding-top: 40px; padding-bottom: 110px; }
  .dn-canh h1 { margin: 0 0 6px; font-family: var(--ttv-phong-tieu-de); font-weight: 800; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; }
  .dn-ghi-chu { display: inline-flex; margin: 0; padding: 4px 14px; border-radius: var(--ttv-bo-nut); background: var(--ttv-the); border: 2px solid var(--ttv-vien); font-weight: 700; font-size: .95rem; }

  /* ---------- Thân ---------- */
  .dn-than { background: var(--ttv-nen); padding: 0 0 56px; }
  .dn-luoi { display: flex; justify-content: center; }
  .dn-the {
    position: relative; width: 100%; max-width: 480px; margin-top: -72px; box-sizing: border-box;
    background: var(--ttv-the); border: 2px solid var(--ttv-vien); border-bottom: 6px solid var(--ttv-lua-dam);
    border-radius: var(--ttv-bo-goc); padding: 28px; box-shadow: 0 6px 0 rgba(0, 48, 96, .06);
  }
  .dn-trau { position: absolute; right: 12px; top: -86px; width: 92px; height: auto; pointer-events: none; }
  .dn-the h2 { margin: 0 0 16px; font-family: var(--ttv-phong-tieu-de); font-weight: 800; font-size: 1.5rem; line-height: 1.2; }

  .dn-nut-rong { width: 100%; }
  .dn-google svg { width: 22px; height: 22px; flex: 0 0 auto; }

  .dn-hoac { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--ttv-chu-phu); font-weight: 700; }
  .dn-hoac::before, .dn-hoac::after { content: ""; flex: 1; height: 2px; background: var(--ttv-vien); }

  .dn-tab { display: flex; gap: 6px; padding: 4px; margin: 0 0 18px; border-radius: var(--ttv-bo-nut); background: var(--ttv-nen); border: 2px solid var(--ttv-vien); }
  .dn-tab button {
    flex: 1; min-height: var(--ttv-cham-toi-thieu); border: 0; border-radius: var(--ttv-bo-nut); background: transparent;
    font: 700 1rem var(--ttv-phong-tieu-de); color: var(--ttv-chu); cursor: pointer; touch-action: manipulation;
  }
  .dn-tab button[aria-selected="true"] { background: var(--ttv-chu); color: #FFFFFF; }

  .dn-o { margin: 0 0 14px; }
  .dn-o label { display: block; margin: 0 0 4px; font-weight: 800; }
  .dn-o input {
    box-sizing: border-box; width: 100%; min-height: 48px; padding: 10px 14px; border: 2px solid var(--ttv-vien); border-radius: 14px;
    font: 600 1rem var(--ttv-phong); color: var(--ttv-chu); background: var(--ttv-the);
  }
  .dn-o input:focus { outline: 3px solid var(--ttv-chu); outline-offset: 1px; border-color: var(--ttv-chu); }
  .dn-goi-y { margin: 4px 0 0; font-size: .9rem; color: var(--ttv-chu-phu); }

  .dn-quen { display: flex; justify-content: center; margin-top: 8px; }
  .dn-link {
    min-height: var(--ttv-cham-toi-thieu); padding: 0 12px; border: 0; background: none; cursor: pointer;
    font: 700 1rem var(--ttv-phong); color: var(--ttv-chu); text-decoration: underline; text-underline-offset: 3px;
  }

  .dn-tin { margin: 16px 0 0; padding: 12px 16px; border-radius: 16px; font-weight: 700; border: 2px solid currentColor; }
  .dn-tin.dung { color: var(--ttv-dung); background: var(--ttv-dung-nen); }
  .dn-tin.sai { color: var(--ttv-sai); background: var(--ttv-sai-nen); }
  .dn-tin.tin { color: var(--ttv-chu); background: var(--ttv-nen); border-color: var(--ttv-vien); }

  /* Đã đăng nhập */
  .dn-ho-so { margin: 0 0 18px; padding: 0; list-style: none; display: grid; gap: 10px; }
  .dn-ho-so li { padding: 12px 16px; border-radius: 16px; background: var(--ttv-nen); border: 2px solid var(--ttv-vien); }
  .dn-ho-so b { display: block; font-size: .9rem; color: var(--ttv-chu-phu); }
  .dn-ho-so span { font-weight: 800; overflow-wrap: anywhere; }
  .dn-nhan { display: inline-flex; margin-top: 6px; padding: 2px 12px; border-radius: var(--ttv-bo-nut); font-size: .9rem; font-weight: 800; border: 2px solid currentColor; }
  .dn-nhan.dung { color: var(--ttv-dung); background: var(--ttv-dung-nen); }
  .dn-nhan.sai { color: var(--ttv-sai); background: var(--ttv-sai-nen); }
  .dn-nut-hang { display: grid; gap: 10px; }

  .dn-dang-tai { text-align: center; font-weight: 700; color: var(--ttv-chu-phu); }

  .dn-the button:focus-visible, .cong a:focus-visible { outline: 3px solid var(--ttv-chu); outline-offset: 3px; }

  /* Chân trang */
  .cong-chan { border-top: 2px solid var(--ttv-vien); background: var(--ttv-the); }
  .cong-chan .ttv-lien-he a { display: inline-flex; align-items: center; min-height: var(--ttv-cham-toi-thieu); }

  @media (max-width: 640px) {
    .cong-ruot { padding: 0 16px; }
    .cong-dau .cong-ruot { height: 64px; }
    .cong-logo img { height: 38px; }
    .dn-canh { padding-top: 28px; }
    .dn-the { padding: 22px 18px; }
    .dn-trau { width: 76px; top: -72px; }
  }
</style>
</head>
<body class="cong" data-ttv-khong-thanh>

<header class="cong-dau">
  <div class="cong-ruot">
    <a class="cong-logo" href="/" data-nhan="veCong">
      <img src="https://mau.cvcec.org/assets/logo.png" width="124" height="48" alt="Trường Tiếng Việt Của Em">
    </a>
    <div class="ttv-thanh-ngon-ngu" role="group" data-nhan="ngonNgu"></div>
  </div>
</header>

<main>
  <section class="ttv-canh dn-canh" aria-labelledby="tieu-de-trang">
    <div class="cong-ruot">
      <h1 id="tieu-de-trang" data-chu="tieuDe">Thử đăng nhập</h1>
      <p class="dn-ghi-chu" data-chu="ghiChu">Trang thử nghiệm của nhà trường</p>
    </div>
  </section>

  <section class="dn-than">
    <div class="cong-ruot dn-luoi">
      <div class="dn-the">
        <img class="dn-trau" id="dn-trau" src="https://mau.cvcec.org/assets/trau-wave.png" width="297" height="342" alt="" aria-hidden="true">

        <p class="dn-dang-tai" id="khung-cho" data-chu="dangTai">Đang tải…</p>

        <!-- ===== Chưa đăng nhập ===== -->
        <div id="khung-vao" hidden>
          <h2 id="tieu-de-vao" data-chu="chaoMung">Chào các bạn!</h2>

          <button type="button" class="ttv-nut-phu dn-nut-rong dn-google" id="nut-google">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
            <span data-chu="nutGoogle">Đăng nhập bằng Google</span>
          </button>

          <p class="dn-hoac"><span data-chu="hoac">hoặc dùng email</span></p>

          <div class="dn-tab" role="tablist" data-nhan="nhanTab">
            <button type="button" role="tab" id="tab-vao" aria-controls="form-email" aria-selected="true" data-chu="tabVao">Đăng nhập</button>
            <button type="button" role="tab" id="tab-ky" aria-controls="form-email" aria-selected="false" data-chu="tabKy">Đăng ký</button>
          </div>

          <form id="form-email" role="tabpanel" aria-labelledby="tab-vao" novalidate>
            <div class="dn-o" id="o-ten" hidden>
              <label for="o-ho-ten" data-chu="hoTen">Họ và tên</label>
              <input id="o-ho-ten" name="hoTen" type="text" autocomplete="name" maxlength="100">
            </div>
            <div class="dn-o">
              <label for="o-email" data-chu="email">Email</label>
              <input id="o-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required>
            </div>
            <div class="dn-o">
              <label for="o-mat-khau" data-chu="matKhau">Mật khẩu</label>
              <input id="o-mat-khau" name="matKhau" type="password" autocomplete="current-password" minlength="6" required aria-describedby="goi-y-mk">
              <p class="dn-goi-y" id="goi-y-mk" hidden data-chu="goiYMatKhau">Ít nhất 6 ký tự.</p>
            </div>
            <button type="submit" class="ttv-nut dn-nut-rong" id="nut-gui" data-chu="nutVao">Đăng nhập</button>
          </form>

          <div class="dn-quen" id="khung-quen">
            <button type="button" class="dn-link" id="nut-quen" data-chu="quenMatKhau">Quên mật khẩu?</button>
          </div>
        </div>

        <!-- ===== Đã đăng nhập ===== -->
        <div id="khung-da-vao" hidden>
          <h2 id="loi-chao"></h2>
          <ul class="dn-ho-so">
            <li><b data-chu="hoTen">Họ và tên</b><span id="hs-ten"></span></li>
            <li>
              <b data-chu="email">Email</b><span id="hs-email" lang="en"></span><br>
              <span class="dn-nhan" id="hs-xac-nhan"></span>
            </li>
            <li><b data-chu="hoSo">Hồ sơ trên hệ thống</b><span id="hs-ho-so"></span></li>
          </ul>
          <div class="dn-nut-hang">
            <button type="button" class="ttv-nut-phu dn-nut-rong" id="nut-gui-lai" hidden data-chu="guiLai">Gửi lại email xác nhận</button>
            <button type="button" class="ttv-nut-phu dn-nut-rong" id="nut-kiem-tra" hidden data-chu="kiemTraLai">Tôi đã xác nhận – kiểm tra lại</button>
            <button type="button" class="ttv-nut dn-nut-rong" id="nut-ra" data-chu="dangXuat">Đăng xuất</button>
          </div>
        </div>

        <p class="dn-tin" id="tin" role="status" aria-live="polite" hidden></p>
      </div>
    </div>
  </section>
</main>

<footer class="cong-chan">
  <!-- Bộ mẫu điền dòng bản quyền mờ và liên hệ vào đây -->
  <div data-ttv-chan></div>
</footer>

const $ = (id) => document.getElementById(id);
let ngonNgu = "vi";
let cheDo = "vao";          // "vao" = đăng nhập, "ky" = đăng ký
let tenChoDangKy = "";      // họ tên gõ ở form đăng ký, dùng khi tạo hồ sơ
let nguoiDung = null;
let hoSo = null;            // { ngayTao: Date|null, moi: bool } | { loi: true }
let tinHienTai = null;      // { khoa, loai, thay }

function dien(mau, thay) { return String(mau).replace(/\{(\w+)\}/g, (_, k) => (thay && thay[k] != null ? thay[k] : "")); }
function c() { return CHU[ngonNgu]; }

function docNgonNgu() {
  if (window.TTV && typeof window.TTV.ngonNgu === "function") return window.TTV.ngonNgu();
  try { const v = localStorage.getItem(KHOA_NGON_NGU); if (v === "vi" || v === "en") return v; } catch (e) {}
  return "vi";
}
function datNgonNgu(ma) {
  if (ma !== "vi" && ma !== "en") return;
  if (window.TTV && typeof window.TTV.datNgonNgu === "function") window.TTV.datNgonNgu(ma);
  else { try { localStorage.setItem(KHOA_NGON_NGU, ma); } catch (e) {} }
  ngonNgu = ma;
  capNhatChu();
}
function dungNutNgonNgu() {
  const nhom = document.querySelector(".ttv-thanh-ngon-ngu[data-nhan='ngonNgu']");
  nhom.textContent = "";
  ["vi", "en"].forEach((ma) => {
    const b = document.createElement("button");
    b.type = "button"; b.lang = ma; b.textContent = ma.toUpperCase();
    b.setAttribute("data-ma", ma);
    b.setAttribute("aria-label", ma === "vi" ? "Tiếng Việt" : "English");
    b.addEventListener("click", () => datNgonNgu(ma));
    nhom.appendChild(b);
  });
}

/* ---------- Thông báo ---------- */
function bao(khoa, loai, thay) { tinHienTai = { khoa, loai, thay }; veTin(); }
function baoLoi(e) {
  const ma = (e && e.code) || "macDinh";
  tinHienTai = { loi: ma, loai: "sai" };
  veTin();
  if (ma === "macDinh" || !CHU.vi.loi[ma]) console.error(e);
}
function xoaTin() { tinHienTai = null; veTin(); }
function veTin() {
  const el = $("tin");
  if (!tinHienTai) { el.hidden = true; el.textContent = ""; return; }
  let chu;
  if (tinHienTai.loi) chu = c().loi[tinHienTai.loi] || dien(c().loi.macDinh, { ma: tinHienTai.loi });
  else chu = dien(c()[tinHienTai.khoa], tinHienTai.thay);
  el.className = "dn-tin " + tinHienTai.loai;
  el.textContent = chu;
  el.hidden = false;
}

/* ---------- Chữ theo ngôn ngữ ---------- */
function capNhatChu() {
  const t = c();
  document.documentElement.lang = ngonNgu;
  document.querySelectorAll("[data-chu]").forEach((el) => { const k = el.getAttribute("data-chu"); if (t[k] != null) el.textContent = t[k]; });
  document.querySelectorAll("[data-nhan]").forEach((el) => { const k = el.getAttribute("data-nhan"); if (t[k] != null) el.setAttribute("aria-label", t[k]); });
  document.querySelectorAll(".ttv-thanh-ngon-ngu button[data-ma]").forEach((b) => b.setAttribute("aria-pressed", b.getAttribute("data-ma") === ngonNgu ? "true" : "false"));
  $("nut-gui").textContent = cheDo === "ky" ? t.nutKy : t.nutVao;
  document.title = t.tieuDe + " · " + TEN_TRUONG;
  auth.languageCode = ngonNgu; // email xác nhận / đặt lại mật khẩu theo ngôn ngữ đang chọn
  veDaVao();
  veTin();
}

function datCheDo(moi) {
  cheDo = moi;
  const ky = moi === "ky";
  $("tab-vao").setAttribute("aria-selected", ky ? "false" : "true");
  $("tab-ky").setAttribute("aria-selected", ky ? "true" : "false");
  $("form-email").setAttribute("aria-labelledby", ky ? "tab-ky" : "tab-vao");
  $("o-ten").hidden = !ky;
  $("goi-y-mk").hidden = !ky;
  $("khung-quen").hidden = ky;
  $("o-mat-khau").autocomplete = ky ? "new-password" : "current-password";
  $("nut-gui").textContent = ky ? c().nutKy : c().nutVao;
  xoaTin();
}

function dangBan(ban) {
  document.querySelectorAll(".dn-the button, .dn-the input").forEach((el) => { el.disabled = ban; });
}

/* ---------- Hồ sơ users/{uid} ---------- */
async function damBaoHoSo(user) {
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    const d = snap.data();
    return { ten: d.hoTen, ngayTao: d.ngayTao && d.ngayTao.toDate ? d.ngayTao.toDate() : null, moi: false };
  }
  const ten = (tenChoDangKy || user.displayName || (user.email || "").split("@")[0] || "").trim().slice(0, 100);
  // Chỉ 3 trường: họ tên, email, ngày tạo (do máy chủ ghi). Chưa thu thêm thông tin gì khác.
  await setDoc(ref, { hoTen: ten, email: user.email, ngayTao: serverTimestamp() });
  return { ten, ngayTao: null, moi: true };
}

function veDaVao() {
  if (!nguoiDung) return;
  const t = c();
  const ten = (hoSo && hoSo.ten) || nguoiDung.displayName || nguoiDung.email;
  $("loi-chao").textContent = dien(t.chao, { ten });
  $("hs-ten").textContent = ten;
  $("hs-email").textContent = nguoiDung.email || "";
  const xn = $("hs-xac-nhan");
  xn.textContent = nguoiDung.emailVerified ? t.daXacNhan : t.chuaXacNhan;
  xn.className = "dn-nhan " + (nguoiDung.emailVerified ? "dung" : "sai");
  const dungMatKhau = nguoiDung.providerData.some((p) => p.providerId === "password");
  $("nut-gui-lai").hidden = nguoiDung.emailVerified || !dungMatKhau;
  $("nut-kiem-tra").hidden = nguoiDung.emailVerified || !dungMatKhau;
  let hs;
  if (!hoSo) hs = t.dangTai;
  else if (hoSo.loi) hs = t.hoSoLoi;
  else if (hoSo.moi || !hoSo.ngayTao) hs = t.hoSoMoi;
  else hs = dien(t.hoSoCo, { ngay: hoSo.ngayTao.toLocaleDateString(ngonNgu === "en" ? "en-CA" : "vi-VN", { day: "numeric", month: "long", year: "numeric" }) });
  $("hs-ho-so").textContent = hs;
}

function hienKhung(ten) {
  $("khung-cho").hidden = ten !== "cho";
  $("khung-vao").hidden = ten !== "vao";
  $("khung-da-vao").hidden = ten !== "da-vao";
  $("dn-trau").src = "https://mau.cvcec.org/assets/" + (ten === "da-vao" ? "trau-cheer.png" : "trau-wave.png");
}

/* ---------- Sự kiện ---------- */
$("tab-vao").addEventListener("click", () => datCheDo("vao"));
$("tab-ky").addEventListener("click", () => datCheDo("ky"));

$("nut-google").addEventListener("click", async () => {
  xoaTin(); dangBan(true);
  try {
    const nhaCungCap = new GoogleAuthProvider();
    nhaCungCap.setCustomParameters({ prompt: "select_account" });
    await signInWithPopup(auth, nhaCungCap);
  } catch (e) { baoLoi(e); }
  finally { dangBan(false); }
});

$("form-email").addEventListener("submit", async (ev) => {
  ev.preventDefault(); xoaTin();
  const email = $("o-email").value.trim();
  const matKhau = $("o-mat-khau").value;
  if (!email) return baoLoi({ code: "auth/missing-email" });
  if (!matKhau) return baoLoi({ code: "auth/missing-password" });
  dangBan(true);
  try {
    if (cheDo === "ky") {
      tenChoDangKy = $("o-ho-ten").value.normalize("NFC").trim().slice(0, 100);
      const kq = await createUserWithEmailAndPassword(auth, email, matKhau);
      if (tenChoDangKy) await updateProfile(kq.user, { displayName: tenChoDangKy });
      await sendEmailVerification(kq.user);
      bao("tinDaGuiXacNhan", "dung", { email });
    } else {
      await signInWithEmailAndPassword(auth, email, matKhau);
    }
    $("o-mat-khau").value = "";
  } catch (e) { baoLoi(e); }
  finally { dangBan(false); }
});

$("nut-quen").addEventListener("click", async () => {
  const email = $("o-email").value.trim();
  if (!email) { bao("tinCanEmail", "tin"); $("o-email").focus(); return; }
  dangBan(true);
  try {
    await sendPasswordResetEmail(auth, email);
    bao("tinQuen", "tin", { email });
  } catch (e) {
    if (e && e.code === "auth/user-not-found") bao("tinQuen", "tin", { email }); // không tiết lộ email có tài khoản hay không
    else baoLoi(e);
  } finally { dangBan(false); }
});

$("nut-gui-lai").addEventListener("click", async () => {
  if (!nguoiDung) return;
  dangBan(true);
  try { await sendEmailVerification(nguoiDung); bao("tinGuiLai", "dung", { email: nguoiDung.email }); }
  catch (e) { baoLoi(e); }
  finally { dangBan(false); }
});

$("nut-kiem-tra").addEventListener("click", async () => {
  if (!nguoiDung) return;
  dangBan(true);
  try {
    await reload(nguoiDung);
    nguoiDung = auth.currentUser;
    if (nguoiDung.emailVerified) await nguoiDung.getIdToken(true);
    veDaVao();
    bao(nguoiDung.emailVerified ? "tinDaXacNhan" : "tinChuaXacNhan", nguoiDung.emailVerified ? "dung" : "tin");
  } catch (e) { baoLoi(e); }
  finally { dangBan(false); }
});

$("nut-ra").addEventListener("click", async () => {
  dangBan(true);
  try { await signOut(auth); bao("tinDaRa", "tin"); }
  catch (e) { baoLoi(e); }
  finally { dangBan(false); }
});

/* ---------- Khởi động ---------- */
ngonNgu = docNgonNgu();
dungNutNgonNgu();
document.addEventListener("ttv-ngon-ngu", (e) => {
  const ma = e && e.detail && e.detail.ngonNgu;
  if ((ma === "vi" || ma === "en") && ma !== ngonNgu) { ngonNgu = ma; capNhatChu(); }
});
datCheDo("vao");
capNhatChu();

onAuthStateChanged(auth, async (user) => {
  nguoiDung = user;
  hoSo = null;
  if (!user) { hienKhung("vao"); return; }
  hienKhung("da-vao");
  veDaVao();
  try { hoSo = await damBaoHoSo(user); }
  catch (e) { hoSo = { loi: true }; baoLoi(e); }
  tenChoDangKy = "";
  veDaVao();
});
</script>
</body>
</html>
