<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đội ngũ giáo viên · Trường Tiếng Việt Của Em</title>
<meta name="description" content="Đội ngũ giáo viên của Trường Tiếng Việt Của Em – Canada Vietnam Cultural & Educational Council (CVCEC).">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/trang-tri/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/trang-tri/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/trang-tri/apple-touch-icon.png">
<link rel="stylesheet" href="https://mau.cvcec.org/v1/cvcec-chung.css">
<script>window.CONG_CHU = {
  vi: { tieuDe: "Đội ngũ giáo viên", noiCongTac: "Nơi công tác: ", loiTai: "Chưa tải được danh sách thầy cô. Các bạn tải lại trang nhé." },
  en: { tieuDe: "Our teachers", noiCongTac: "Workplace: ", loiTai: "The teacher list could not be loaded. Please reload the page." }
};</script>
<link rel="stylesheet" href="/chung/cong.css?v=10">
<script src="https://mau.cvcec.org/v1/cvcec-chung.js" defer></script>
<script src="/chung/canh.js?v=7" defer></script>
<script src="/chung/cong.js?v=10" defer></script>
<script type="module" src="/js/tai-khoan.js?v=8"></script>
<style>
  /* Trang Giáo viên. Màu và phông chỉ lấy từ biến --ttv-* của bộ mẫu. */
  :root {
    --gv-co: color-mix(in srgb, var(--ttv-lua-sang) 28%, var(--ttv-the));
    --gv-khoang: 120px;
  }
  /* ---------- Con đường và các thẻ ---------- */
  .gv-than { background: var(--gv-co); padding: 48px 0 40px; }
  .gv-duong { position: relative; }
  .gv-duong-ve { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; z-index: 0; pointer-events: none; }
  .gv-duong-ve path { fill: none; stroke: var(--ttv-the); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 0.1 16; }
  .gv-duong-ve path.vien { stroke: var(--ttv-lua-dam); stroke-width: 10; opacity: .35; }
  .gv-trau {
    position: absolute; left: 0; top: 0; z-index: 1; width: 78px; height: auto; pointer-events: none;
    transform: translate(-50%, -100%); will-change: left, top;
  }
  .gv-ds {
    position: relative; z-index: 2; list-style: none; margin: 0; padding: 30px 0 130px;
    display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--gv-khoang); row-gap: 28px;
  }
  .gv-ds > li { display: flex; }
  .gv-ds > li:nth-child(odd) { grid-column: 1; }
  .gv-ds > li:nth-child(even) { grid-column: 2; }
  .gv-the {
    flex: 1 1 auto; box-sizing: border-box; background: var(--ttv-the); color: var(--ttv-chu);
    border: 2px solid var(--ttv-vien); border-radius: var(--ttv-bo-goc); padding: 22px;
    box-shadow: 0 6px 0 rgba(0, 48, 96, .06);
  }
  .gv-the-dau { display: flex; gap: 18px; align-items: flex-start; }
  .gv-anh { position: relative; flex: 0 0 auto; width: 128px; }
  .gv-anh .gv-chan-dung { display: block; width: 128px; height: 160px; object-fit: cover; border-radius: 18px; background: var(--ttv-kem-rom); }
  .gv-huy-hieu {
    position: absolute; left: -8px; bottom: -8px; width: 40px; height: 40px; border-radius: 50%;
    background: var(--ttv-the); border: 3px solid var(--ttv-the); box-shadow: 0 2px 6px rgba(0, 48, 96, .2); object-fit: cover;
  }
  .gv-ten { margin: 4px 0 6px; font-family: var(--ttv-phong-tieu-de); font-weight: 800; font-size: 1.4rem; line-height: 1.2; color: var(--ttv-chu); }
  .gv-chuc-danh { margin: 0 0 8px; color: var(--ttv-dung); font-weight: 700; line-height: 1.35; }
  .gv-noi { margin: 0; display: flex; align-items: flex-start; gap: 6px; color: var(--ttv-chu-phu); font-weight: 700; font-size: .95rem; }
  .gv-noi svg { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 2px; color: var(--ttv-dung); }
  .gv-gioi-thieu { margin: 16px 0 0; font-size: 1rem; line-height: 1.6; }
  .gv-loi { text-align: center; font-weight: 700; padding: 24px; }

  @media (max-width: 960px) {
    :root { --gv-khoang: 96px; }
    .gv-the-dau { flex-direction: column; }
  }
  /* Điện thoại: một cột */
  @media (max-width: 700px) {
    .gv-ds { grid-template-columns: 1fr; row-gap: 40px; }
    .gv-ds > li:nth-child(n) { grid-column: 1; grid-row: auto !important; }
    .gv-the-dau { flex-direction: row; }
  }
  @media (max-width: 640px) {
    .gv-than { padding-top: 28px; }
    .gv-the { padding: 18px; }
    .gv-anh, .gv-anh .gv-chan-dung { width: 104px; }
    .gv-anh .gv-chan-dung { height: 130px; }
    .gv-ten { font-size: 1.25rem; }
    .gv-trau { width: 64px; }
  }
  @media (max-width: 380px) {
    .gv-the-dau { flex-direction: column; }
  }
</style>
</head>
<body class="cong" data-ttv-khong-thanh data-trang="giao-vien" data-tieu-de="tieuDe">

<header class="cong-dau" data-cong-dau></header>

<main>
  <section class="trang-dau co-canh" data-canh="lang-que" aria-labelledby="tieu-de-trang">
    <div class="cong-ruot">
      <h1 id="tieu-de-trang" data-chu="tieuDe">Đội ngũ giáo viên</h1>
    </div>
  </section>

  <section class="gv-than">
    <div class="cong-ruot">
      <div class="gv-duong" id="gv-duong">
        <svg class="gv-duong-ve" aria-hidden="true" focusable="false"><path class="vien" id="gv-path-vien" d=""></path><path id="gv-path" d=""></path></svg>
        <img class="gv-trau" id="gv-trau" src="https://mau.cvcec.org/assets/trau-hiking.png" width="292" height="353" alt="" aria-hidden="true">
        <ol class="gv-ds" id="gv-ds"></ol>
        <p class="gv-loi" id="gv-loi" hidden data-chu="loiTai">Chưa tải được danh sách thầy cô. Các bạn tải lại trang nhé.</p>
      </div>
    </div>
  </section>
</main>

<footer class="cong-chan" data-cong-chan>
  <!-- cong.js dựng phần trên; bộ mẫu điền dòng bản quyền mờ và liên hệ vào đây -->
  <div data-ttv-chan></div>
</footer>

<script>
(function () {
  "use strict";

  var THU_MUC_ANH = "/assets/giao-vien/";
  var HUY_HIEU = THU_MUC_ANH + "cvcec-emblem.webp";
  var ICON_GHIM = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>';

  var GV = [];       // danh sách thầy cô từ teachers.json
  var dsEl = document.getElementById("gv-ds");
  var duongEl = document.getElementById("gv-duong");
  var path = document.getElementById("gv-path");
  var pathVien = document.getElementById("gv-path-vien");
  var trau = document.getElementById("gv-trau");
  var doDai = 0;

  function tao(t, l, c) { return window.CONG.tao(t, l, c); }

  /* ---------- Thẻ giáo viên ---------- */
  function dungThe() {
    dsEl.textContent = "";
    GV.forEach(function (gv, i) {
      var li = tao("li");
      li.style.gridRow = (i + 1) + " / span 2"; // so le trái – phải
      var art = tao("article", "gv-the");
      art.setAttribute("aria-labelledby", "gv-ten-" + gv.id);
      var dau = tao("div", "gv-the-dau");
      var khung = tao("div", "gv-anh");
      var anh = tao("img", "gv-chan-dung");
      anh.src = THU_MUC_ANH + gv.anh;
      anh.width = 800; anh.height = 1000; // ảnh chân dung tỉ lệ 4:5
      anh.alt = gv.ten;
      anh.lang = "vi";
      khung.appendChild(anh);
      var huy = tao("img", "gv-huy-hieu");
      huy.src = HUY_HIEU; huy.width = 160; huy.height = 160; huy.alt = "";
      khung.appendChild(huy);
      dau.appendChild(khung);

      var chu = tao("div");
      var ten = tao("h2", "gv-ten", gv.ten);
      ten.id = "gv-ten-" + gv.id;
      ten.lang = "vi";
      chu.appendChild(ten);
      chu.appendChild(tao("p", "gv-chuc-danh"));
      var noi = tao("p", "gv-noi");
      noi.innerHTML = ICON_GHIM + '<span class="cong-an gv-noi-nhan"></span><span class="gv-noi-chu"></span>';
      chu.appendChild(noi);
      dau.appendChild(chu);
      art.appendChild(dau);
      art.appendChild(tao("p", "gv-gioi-thieu"));
      art.setAttribute("data-gv", String(i));
      li.appendChild(art);
      dsEl.appendChild(li);
    });
  }

  // Chữ trên thẻ theo ngôn ngữ (thanh trên, chân trang do /chung/cong.js lo)
  function capNhatThe(ngonNgu) {
    var c = window.CONG.chu();
    var the = dsEl.querySelectorAll("[data-gv]");
    for (var t = 0; t < the.length; t++) {
      var gv = GV[+the[t].getAttribute("data-gv")];
      var en = ngonNgu === "en";
      the[t].querySelector(".gv-chuc-danh").textContent = en ? gv.chuc_danh_en : gv.chuc_danh_vi;
      the[t].querySelector(".gv-noi-nhan").textContent = c.noiCongTac;
      the[t].querySelector(".gv-noi-chu").textContent = en ? gv.noi_cong_tac_en : gv.noi_cong_tac_vi;
      the[t].querySelector(".gv-gioi-thieu").textContent = en ? gv.gioi_thieu_en : gv.gioi_thieu_vi;
    }
    veDuong();
  }

  /* ---------- Con đường chấm nối các thẻ, Trâu Con đi dọc đường ---------- */
  function veDuong() {
    var the = dsEl.querySelectorAll(".gv-the");
    if (!the.length) { path.setAttribute("d", ""); pathVien.setAttribute("d", ""); trau.hidden = true; return; }
    var goc = duongEl.getBoundingClientRect();
    var motCot = window.matchMedia("(max-width: 700px)").matches;
    var diem = [];
    var r0 = the[0].getBoundingClientRect();
    var giua = goc.width / 2;
    diem.push({ x: motCot ? giua : giua, y: r0.top - goc.top - 30 });
    for (var i = 0; i < the.length; i++) {
      var r = the[i].getBoundingClientRect();
      var y = r.top - goc.top + r.height / 2;
      var x;
      if (motCot) x = giua;
      else x = (i % 2 === 0) ? (r.right - goc.left) : (r.left - goc.left); // mép trong của thẻ
      diem.push({ x: x, y: y });
    }
    var rc = the[the.length - 1].getBoundingClientRect();
    diem.push({ x: giua, y: rc.bottom - goc.top + 110 });

    var d = "M" + diem[0].x.toFixed(1) + " " + diem[0].y.toFixed(1);
    for (var k = 1; k < diem.length; k++) {
      var a = diem[k - 1], b = diem[k], dy = (b.y - a.y) * 0.5;
      d += " C" + a.x.toFixed(1) + " " + (a.y + dy).toFixed(1) + " " + b.x.toFixed(1) + " " + (b.y - dy).toFixed(1) + " " + b.x.toFixed(1) + " " + b.y.toFixed(1);
    }
    path.setAttribute("d", d);
    pathVien.setAttribute("d", d);
    try { doDai = path.getTotalLength(); } catch (e) { doDai = 0; }
    trau.hidden = false;
    datTrau();
  }

  var choKhung = 0;
  function datTrau() {
    if (!doDai) return;
    var goc = duongEl.getBoundingClientRect();
    var tiLe;
    var giam = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var motCot = window.matchMedia("(max-width: 700px)").matches;
    if (giam || motCot) {
      tiLe = 1; // đứng ở cuối đường
    } else {
      var tam = window.innerHeight * 0.55;
      tiLe = (tam - goc.top) / Math.max(1, goc.height);
      tiLe = Math.max(0, Math.min(1, tiLe));
    }
    var p = path.getPointAtLength(tiLe * doDai);
    trau.style.left = p.x + "px";
    trau.style.top = (p.y + 6) + "px";
  }
  function khiCuon() {
    if (choKhung) return;
    choKhung = window.requestAnimationFrame(function () { choKhung = 0; datTrau(); });
  }

  /* ---------- Khởi động (sau cvcec-chung.js và cong.js) ---------- */
  document.addEventListener("DOMContentLoaded", function () {
    window.CONG.khiDoiChu(capNhatThe);
    window.addEventListener("scroll", khiCuon, { passive: true });
    var hen = 0;
    window.addEventListener("resize", function () { clearTimeout(hen); hen = setTimeout(veDuong, 120); });
    window.addEventListener("load", veDuong);

    fetch("teachers.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (du) {
        GV = (du && Array.isArray(du.giao_vien)) ? du.giao_vien : [];
        if (!GV.length) throw new Error("rong");
        dungThe();
        capNhatThe(window.CONG.ngonNgu());
        if (window.ResizeObserver) new ResizeObserver(function () { veDuong(); }).observe(dsEl);
        var anh = dsEl.querySelectorAll("img");
        for (var i = 0; i < anh.length; i++) anh[i].addEventListener("load", veDuong);
      })
      .catch(function () {
        document.getElementById("gv-loi").hidden = false;
        trau.hidden = true;
      });
  });
})();
</script>
</body>
</html>
