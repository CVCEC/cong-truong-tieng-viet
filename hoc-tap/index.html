<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Làng học tập Trâu Con: các góc học tiếng Việt và văn hoá Việt.">
<meta property="og:title" content="Học tập · Trường Tiếng Việt Của Em">
<meta property="og:description" content="Làng học tập Trâu Con: các góc học tiếng Việt và văn hoá Việt.">
<meta property="og:image" content="https://vietclass.cvcec.org/assets/trang-tri/og-image.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/trang-tri/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/trang-tri/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/trang-tri/apple-touch-icon.png">
<link rel="stylesheet" href="https://mau.cvcec.org/v1/cvcec-chung.css">
<link rel="stylesheet" href="/chung/cong.css?v=8">
<style>
  .ht-lo-trinh { max-width: 46em; margin: 0 auto 24px; text-align: center; color: var(--ttv-chu); font-size: 1.05rem; }
  .ht-lo-trinh a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 800; color: var(--ttv-chu); }
  .cong-luoi li { position: relative; }
  .ht-so { position: absolute; z-index: 2; top: -10px; left: -6px; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ttv-chu); color: #FFFFFF; font-family: var(--ttv-phong-tieu-de); font-weight: 800; font-size: 1.05rem; box-shadow: 0 0 0 3px var(--ttv-nen); pointer-events: none; }
  .ht-bac { display: inline-block; align-self: flex-start; margin: 2px 0 4px; padding: 2px 10px; border-radius: 999px; background: var(--ttv-kem-rom); color: var(--ttv-chu); font-weight: 800; font-size: .85rem; }
</style>
<script>window.CONG_CHU = {
  "vi": {
    "vaoHoc": "Vào học →",
    "loiTai": "Chưa tải được danh sách góc học. Các bạn tải lại trang nhé.",
    "chonGoc": "Chọn một góc học",
    "hocTapTieuDe": "Học tập",
    "hocTapPhuDe": "Làng học tập Trâu Con",
    "loTrinh": "Các góc học xếp theo lộ trình \"Đường làng của Trâu Con\" (Khung năng lực tiếng Việt dùng cho người nước ngoài): người mới bắt đầu đi từ góc số 1. Nhãn bậc cho biết góc học hợp với chặng nào: Bậc 0 Làm quen, Sơ cấp Bậc 1–2, Trung cấp Bậc 3–4.",
    "xemTienDo": "Xem chặng đường của bạn",
    "bac": "Bậc {a}",
    "bacTu": "Bậc {a}–{b}"
  },
  "en": {
    "vaoHoc": "Start →",
    "loiTai": "The learning corners could not be loaded. Please reload the page.",
    "chonGoc": "Choose a learning corner",
    "hocTapTieuDe": "Learning",
    "hocTapPhuDe": "Trâu Con's Learning Village",
    "loTrinh": "The corners follow the \"Trâu Con's village path\" learning path (Vietnamese Language Proficiency Framework for foreigners): beginners start at corner 1. The level label shows which stop each corner suits: Level 0 Getting started, Elementary Levels 1–2, Intermediate Levels 3–4.",
    "xemTienDo": "See your learning path",
    "bac": "Level {a}",
    "bacTu": "Levels {a}–{b}"
  }
};</script>
<script src="https://mau.cvcec.org/v1/cvcec-chung.js" defer></script>
<script src="https://mau.cvcec.org/v1/ttv-lo-trinh.js" defer></script>
<script src="/chung/canh.js?v=7" defer></script>
<script src="/chung/cong.js?v=8" defer></script>
<script type="module" src="/js/tai-khoan.js?v=8"></script>

</head>
<body class="cong" data-ttv-khong-thanh data-trang="hoc-tap" data-tieu-de="hocTapTieuDe">
  <header class="cong-dau" data-cong-dau></header>
  <main>
    <section class="trang-dau co-canh" data-canh="hoi-an" aria-labelledby="tieu-de-trang">
      <div class="cong-ruot">
        <h1 id="tieu-de-trang" data-chu="hocTapTieuDe">Học tập</h1>
        <p class="trang-phu-de" data-chu="hocTapPhuDe">Làng học tập Trâu Con</p>
      </div>
    </section>
    <section class="cong-phan trang-than" aria-labelledby="tieu-de-goc">
      <div class="cong-ruot">
        <h2 id="tieu-de-goc" class="cong-an" data-chu="chonGoc">Chọn một góc học</h2>
        <p class="ht-lo-trinh"><span data-chu="loTrinh"></span><br><a href="/goc-hoc-tap/" data-chu="xemTienDo">Xem chặng đường của bạn</a></p>
        <ol class="cong-luoi" id="luoi-goc"></ol>
        <p class="cong-doan" id="loi-tai" hidden data-chu="loiTai">Chưa tải được danh sách góc học. Các bạn tải lại trang nhé.</p>
      </div>
    </section>
  </main>
  <footer class="cong-chan" data-cong-chan>
    <!-- cong.js dựng phần trên; bộ mẫu điền dòng bản quyền mờ và liên hệ vào đây -->
    <div data-ttv-chan></div>
  </footer>
<script>
(function () {
  "use strict";
  var DS = [], luoi = document.getElementById("luoi-goc");
  var tao = function (t, l, c) { return window.CONG.tao(t, l, c); };
  function anh(ten) { return window.CONG.anhBoMau(ten); }
  function ganMau(el, muc) {
    el.style.setProperty("--goc", muc.mau);
    el.style.setProperty("--goc-dam", muc.mau_dam);
    el.style.setProperty("--goc-nhat", muc.mau_nhat);
  }
  function dungLuoi() {
    luoi.textContent = "";
    DS.forEach(function (muc, thuTu) {
      var li = tao("li");
      var so = tao("span", "ht-so", String(thuTu + 1));
      so.setAttribute("aria-hidden", "true");
      li.appendChild(so);
      var a = tao("a", "cong-the");
      a.href = "/#" + muc.id; // mở góc học trong khung của cổng
      a.setAttribute("data-goc", muc.id);
      ganMau(a, muc);

      var tren = tao("span", "cong-the-tren");
      tren.appendChild(tao("span", "cong-the-nhan"));
      var img = tao("img");
      img.src = anh(muc.trau);
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      tren.appendChild(img);
      a.appendChild(tren);

      var duoi = tao("span", "cong-the-duoi");
      duoi.appendChild(tao("span", "cong-the-ten"));
      duoi.appendChild(tao("span", "ht-bac"));
      duoi.appendChild(tao("span", "cong-the-mo-ta"));
      duoi.appendChild(tao("span", "cong-the-vao"));
      a.appendChild(duoi);
      var mui = tao("span", "cong-the-mui", "→");
      mui.setAttribute("aria-hidden", "true");
      a.appendChild(mui);

      li.appendChild(a);
      luoi.appendChild(li);
    });
  }

  function capNhatThe(nn) {
    var c = window.CONG.chu();
    var the = luoi.querySelectorAll(".cong-the");
    for (var t = 0; t < the.length; t++) {
      var muc = null;
      for (var i = 0; i < DS.length; i++) if (DS[i].id === the[t].getAttribute("data-goc")) muc = DS[i];
      if (!muc) continue;
      the[t].querySelector(".cong-the-nhan").textContent = nn === "en" ? muc.ngan_en : muc.ngan_vi;
      the[t].querySelector(".cong-the-ten").textContent = nn === "en" ? muc.ten_en : muc.ten_vi;
      the[t].querySelector(".cong-the-mo-ta").textContent = nn === "en" ? muc.mo_ta_en : muc.mo_ta_vi;
      the[t].querySelector(".cong-the-vao").textContent = c.vaoHoc;
      // Nhãn bậc lấy từ lộ trình chung (mau.cvcec.org/v1/ttv-lo-trinh.js)
      var bac = window.TTV_LO_TRINH ? window.TTV_LO_TRINH.bacCuaGoc(muc.id) : [];
      var nhanBac = the[t].querySelector(".ht-bac");
      if (bac.length) {
        var a1 = bac[0], b1 = bac[bac.length - 1];
        nhanBac.textContent = a1 === b1 ? c.bac.replace("{a}", a1) : c.bacTu.replace("{a}", a1).replace("{b}", b1);
        nhanBac.hidden = false;
      } else nhanBac.hidden = true;
      the[t].setAttribute("aria-label", (t + 1) + ". " + (nn === "en" ? muc.ten_en : muc.ten_vi) + (bac.length ? " – " + nhanBac.textContent : ""));
    }
  }
  document.addEventListener("DOMContentLoaded", function () {
    // Chỉ các góc học; Triển lãm đã tách thành trang riêng /trien-lam/
    DS = window.CONG.gocHoc ? window.CONG.gocHoc() : window.CONG.danhSach();
    if (!DS.length) document.getElementById("loi-tai").hidden = false;
    dungLuoi();
    window.CONG.khiDoiChu(capNhatThe);
    capNhatThe(window.CONG.ngonNgu());
  });
})();
</script>
</body>
</html>
