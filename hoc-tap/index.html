<style>
  /* Hai lối vào: Làng học tập Trâu Con (dưới 15 tuổi) và Lộ trình theo khung năng lực (15+) */
  .ht-loi-vao { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 0 0 28px; }
  .ht-loi { display: flex; gap: 14px; align-items: center; min-height: 96px; padding: 14px 18px; background: var(--ttv-the); border: 2px solid var(--ttv-vien); border-bottom-width: 6px; border-radius: var(--ttv-bo-goc); color: var(--ttv-chu); text-decoration: none; }
  .ht-loi[aria-current="true"] { border-color: var(--ttv-lua-dam); }
  .ht-loi img { width: 64px; height: auto; flex: 0 0 auto; }
  .ht-loi b { display: block; font-family: var(--ttv-phong-tieu-de); font-weight: 800; font-size: 1.25rem; line-height: 1.2; }
  .ht-loi span span { display: block; color: var(--ttv-chu-phu); font-weight: 700; font-size: .95rem; margin-top: 2px; }
  .ht-nhom-h { font-family: var(--ttv-phong-tieu-de); font-weight: 800; font-size: 1.5rem; margin: 8px 0 4px; color: var(--ttv-chu); }
  .ht-nhom-mo-ta { margin: 0 0 16px; color: var(--ttv-chu-phu); max-width: 52em; }
  .ht-nhom-15 { margin-top: 40px; }
  .ht-nhom-15 .ttv-nut-phu { margin-top: 16px; }
  @media (max-width: 700px) { .ht-loi-vao { grid-template-columns: 1fr; } }
</style>
<script>window.CONG_CHU = {
  "vi": {
    "vaoHoc": "Vào học →",
    "loiTai": "Chưa tải được danh sách góc học. Các bạn tải lại trang nhé.",
    "chonGoc": "Chọn một góc học",
    "hocTapTieuDe": "Học tập",
    "hocTapPhuDe": "Làng học tập Trâu Con",
    "loiLang": "Làng học tập Trâu Con",
    "loiLangPhu": "Cho các bạn dưới 15 tuổi: học vui qua trò chơi",

    "loiLoTrinhPhu": "Từ 15 tuổi: học theo bậc và 4 kỹ năng",
    "langMoTa": "Các góc học cho các bạn nhỏ, đi từ dễ đến khó: luyện nói, chữ cái và vần, rồi văn hoá, thơ ca, truyện.",
    "loTrinhH": "Lộ trình theo khung năng lực (từ 15 tuổi)",
    "loTrinhMoTa": "Học theo sách Vui học tiếng Việt Quyển 1–2 và Về Nhà Em, xếp theo bậc của Khung năng lực tiếng Việt dùng cho người nước ngoài.",
    "xemLoTrinh": "Xem lộ trình theo bậc"

  "en": {
    "vaoHoc": "Start →",

    "chonGoc": "Choose a learning corner",
    "hocTapTieuDe": "Learning",

    "langMoTa": "Learning corners for children, from easy to harder: speaking, letters and rhymes, then culture, songs and stories.",
    "loTrinhH": "Proficiency-based learning path (ages 15+)",
    "loTrinhMoTa": "Learn with the Vui học tiếng Việt books 1–2 and Về Nhà Em, arranged by the levels of the Vietnamese Language Proficiency Framework for foreigners.",

  }

<script src="https://mau.cvcec.org/v1/cvcec-chung.js" defer></script>
<script src="/chung/canh.js?v=7" defer></script>

</head>
<body class="cong" data-ttv-khong-thanh data-trang="hoc-tap" data-tieu-de="hocTapTieuDe">
  <header class="cong-dau" data-cong-dau></header>
  <main>
    <section class="trang-dau co-canh" data-canh="hoi-an" aria-labelledby="tieu-de-trang">
      <div class="cong-ruot">
        <h1 id="tieu-de-trang" data-chu="hocTapTieuDe">Học tập</h1>
        <p class="trang-phu-de" data-chu="hocTapPhuDe">Làng học tập Trâu Con</p>
      </div>
    </section>
    <section class="cong-phan trang-than" aria-labelledby="tieu-de-goc">
      <div class="cong-ruot">
        <h2 id="tieu-de-goc" class="cong-an" data-chu="chonGoc">Chọn một góc học</h2>
        <nav class="ht-loi-vao" aria-label="Hai hướng học">
          <a class="ht-loi" href="#lang"><img src="/assets/trau/wave.png" alt=""><span><b data-chu="loiLang">Làng học tập Trâu Con</b><span data-chu="loiLangPhu"></span></span></a>
          <a class="ht-loi" href="/lo-trinh/"><img src="/assets/trau/reading.png" alt=""><span><b data-chu="loiLoTrinh">Lộ trình theo khung năng lực</b><span data-chu="loiLoTrinhPhu"></span></span></a>
        </nav>
        <h2 class="ht-nhom-h" id="lang" data-chu="loiLang">Làng học tập Trâu Con</h2>
        <p class="ht-nhom-mo-ta" data-chu="langMoTa"></p>
        <ul class="cong-luoi" id="luoi-goc"></ul>
        <p class="cong-doan" id="loi-tai" hidden data-chu="loiTai">Chưa tải được danh sách góc học. Các bạn tải lại trang nhé.</p>
        <div class="ht-nhom-15">
          <h2 class="ht-nhom-h" id="lo-trinh" data-chu="loTrinhH">Lộ trình theo khung năng lực (từ 15 tuổi)</h2>
          <p class="ht-nhom-mo-ta" data-chu="loTrinhMoTa"></p>
          <ul class="cong-luoi" id="luoi-15"></ul>
          <a class="ttv-nut-phu" href="/lo-trinh/" data-chu="xemLoTrinh">Xem lộ trình theo bậc</a>
        </div>
      </div>
    </section>
  </main>
  <footer class="cong-chan" data-cong-chan>
    <!-- cong.js dựng phần trên; bộ mẫu điền dòng bản quyền mờ và liên hệ vào đây -->
    <div data-ttv-chan></div>
  </footer>
<script>
(function () {
  "use strict";
  var DS = [], luoi = document.getElementById("luoi-goc"), luoi15 = document.getElementById("luoi-15");
  // Góc của Lộ trình theo khung năng lực (15+) có nhom: "lo-trinh" trong TTV_DANH_SACH
  function la15(muc) { return muc.nhom === "lo-trinh"; }
  var tao = function (t, l, c) { return window.CONG.tao(t, l, c); };
  function anh(ten) { return window.CONG.anhBoMau(ten); }
  function ganMau(el, muc) {
    el.style.setProperty("--goc", muc.mau);
    el.style.setProperty("--goc-dam", muc.mau_dam);
    el.style.setProperty("--goc-nhat", muc.mau_nhat);
  }
  function dungLuoi() {
    luoi.textContent = ""; luoi15.textContent = "";
    DS.forEach(function (muc) {
      var li = tao("li");
      var a = tao("a", "cong-the");
      a.href = "/#" + muc.id; // mở góc học trong khung của cổng
      a.setAttribute("data-goc", muc.id);
      ganMau(a, muc);

      var tren = tao("span", "cong-the-tren");
      tren.appendChild(tao("span", "cong-the-nhan"));
      var img = tao("img");
      img.src = anh(muc.trau);
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      tren.appendChild(img);
      a.appendChild(tren);

      var duoi = tao("span", "cong-the-duoi");
      duoi.appendChild(tao("span", "cong-the-ten"));
      duoi.appendChild(tao("span", "cong-the-mo-ta"));
      duoi.appendChild(tao("span", "cong-the-vao"));
      a.appendChild(duoi);
      var mui = tao("span", "cong-the-mui", "→");
      mui.setAttribute("aria-hidden", "true");
      a.appendChild(mui);

      li.appendChild(a);
      (la15(muc) ? luoi15 : luoi).appendChild(li);
    });
  }

  function capNhatThe(nn) {
    var c = window.CONG.chu();
    var the = document.querySelectorAll("#luoi-goc .cong-the, #luoi-15 .cong-the");
    for (var t = 0; t < the.length; t++) {
      var muc = null;
      for (var i = 0; i < DS.length; i++) if (DS[i].id === the[t].getAttribute("data-goc")) muc = DS[i];
      if (!muc) continue;
      the[t].querySelector(".cong-the-nhan").textContent = nn === "en" ? muc.ngan_en : muc.ngan_vi;
      the[t].querySelector(".cong-the-ten").textContent = nn === "en" ? muc.ten_en : muc.ten_vi;
      the[t].querySelector(".cong-the-mo-ta").textContent = nn === "en" ? muc.mo_ta_en : muc.mo_ta_vi;
      the[t].querySelector(".cong-the-vao").textContent = c.vaoHoc;
      the[t].setAttribute("aria-label", nn === "en" ? muc.ten_en : muc.ten_vi);
    }
  }
  document.addEventListener("DOMContentLoaded", function () {
    // Chỉ các góc học; Triển lãm đã tách thành trang riêng /trien-lam/
    DS = window.CONG.gocHoc ? window.CONG.gocHoc() : window.CONG.danhSach();
    if (!DS.length) document.getElementById("loi-tai").hidden = false;
    dungLuoi();
    window.CONG.khiDoiChu(capNhatThe);
    capNhatThe(window.CONG.ngonNgu());
  });
})();
</script>
</body>
</html>
